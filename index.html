<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Narrative Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    #scene-title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #chart {
      border: 1px solid #ccc;
      background: #fafafa;
    }

    .annotation-box {
      max-width: 600px;
      margin-top: 15px;
      padding: 12px 16px;
      background: #fff8dc;
      border-left: 4px solid #d4a017;
      font-size: 15px;
      line-height: 1.4;
    }

    #selected-country-box {
      max-width: 600px;
      margin-top: 12px;
      padding: 10px 16px;
      background: #eef6ff;
      border-left: 4px solid #2b6cb0;
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
    }

    #selected-country-box.empty {
      color: #888;
      font-style: italic;
    }

    #nav {
      margin-top: 20px;
    }

    button {
      font-size: 16px;
      padding: 8px 16px;
      margin: 0 8px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    #scene-indicator {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    .tooltip {
      position: absolute;
      padding: 8px 12px;
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
    }

    .legend {
      font-size: 13px;
    }

    .axis-label {
      font-size: 13px;
      fill: #333;
    }

    circle {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="scene-title"></div>
  <svg id="chart" width="700" height="450"></svg>
  <div id="annotation" class="annotation-box"></div>
  <div id="selected-country-box" class="empty">Click any point to select a country.</div>

  <div id="nav">
    <button id="prevBtn">&larr; Previous</button>
    <button id="nextBtn">Next &rarr;</button>
  </div>
  <div id="scene-indicator"></div>

  <div class="tooltip" id="tooltip"></div>

  <script>

    // ---------------------------------------------------
    // PARAMETERS
    // ---------------------------------------------------
    let currentScene = 0;
    let fullData = [];
    let scene1Data = [];
    let scene2Data = [];
    let scene3Data = [];

    let selectedCountry = null;

    const width = 700;
    const height = 450;
    const margin = { top: 30, right: 30, bottom: 55, left: 60 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const YEAR = 2014;

    const GDP_MIN = 8;
    const GDP_MAX = 14;

    const outlierCountries = ["India", "China", "United States of America"];

    const scenes = [
      {
        title: "Naive Assumptions: GDP vs. Life Expectancy",
        annotation: "As GDP rises, life expectancy tends to rise too — but look closer. " +
                    "Some high-GDP countries (highlighted in red) don't have the life " +
                    "expectancy you'd expect from their wealth alone.",
        draw: drawScene1
      },
      {
        title: "Schooling vs. Life Expectancy",
        annotation: "Compared to the last chart, the relationship between schooling " +
                    "and life expectancy is tighter and more consistent than GDP alone.",
        draw: drawScene2
      },
      {
        title: "A Better Predictor: ICOR vs. Life Expectancy",
        annotation: "Here, the x-axis is income composition of resources (a statistical measure from 0 to 1 on how well " + 
                    "a country generates and distributes income). Compared to the spread " +
                    "of schooling chart, this appears to be an even stronger " +
                    "predictor than schooling.",
        draw: drawScene3
      }
    ];

    // ---------------------------------------------------
    // TRIGGERS
    // ---------------------------------------------------
    d3.select("#nextBtn").on("click", function() {
      if (currentScene < scenes.length - 1) {
        currentScene++;
        render();
      }
    });

    d3.select("#prevBtn").on("click", function() {
      if (currentScene > 0) {
        currentScene--;
        render();
      }
    });

    // ---------------------------------------------------
    // LOAD DATA
    // ---------------------------------------------------
    d3.csv("life_expectancy_gdp_data.csv").then(function(data) {

      data.forEach(d => {
        d.Year = +d.Year;
        d.GDP = d.GDP === "" ? null : +d.GDP;
        d["Life expectancy"] = d["Life expectancy"] === "" ? null : +d["Life expectancy"];
        d.Schooling = d.Schooling === "" ? null : +d.Schooling;
        d["Income composition of resources"] = d["Income composition of resources"] === "" ? null : +d["Income composition of resources"];
      });

      fullData = data;

      scene1Data = fullData.filter(d =>
        d.Year === YEAR &&
        d.GDP !== null &&
        d["Life expectancy"] !== null
      );

      scene2Data = fullData.filter(d =>
        d.Year === YEAR &&
        d.Schooling !== null &&
        d["Life expectancy"] !== null
      );

      scene3Data = fullData.filter(d =>
        d.Year === YEAR &&
        d["Income composition of resources"] !== null &&
        d["Life expectancy"] !== null
      );

      console.log("Scene 1 data points:", scene1Data.length);
      console.log("Scene 2 data points (schooling):", scene2Data.length);
      console.log("Scene 3 data points (Income composition of resources):", scene3Data.length);

      render();
    }).catch(function(error) {
      console.error("Error loading CSV:", error);
      d3.select("#scene-title").text("Error loading data — check console.");
    });

    // ---------------------------------------------------
    // RENDER
    // ---------------------------------------------------
    function render() {
      d3.select("#scene-title").text(scenes[currentScene].title);
      d3.select("#annotation").text(scenes[currentScene].annotation);
      d3.select("#scene-indicator")
        .text("Scene " + (currentScene + 1) + " of " + scenes.length);

      d3.select("#prevBtn").property("disabled", currentScene === 0);
      d3.select("#nextBtn").property("disabled", currentScene === scenes.length - 1);

      const svg = d3.select("#chart");
      svg.selectAll("*").remove();

      scenes[currentScene].draw(svg);

      updateSelectedCountryBox();
    }

    // ---------------------------------------------------
    // Updates the persistent readout box based on
    // selectedCountry, now including Scene 3's data too.
    // ---------------------------------------------------
    function updateSelectedCountryBox() {
      const box = d3.select("#selected-country-box");

      if (!selectedCountry) {
        box.classed("empty", true)
          .text("Click any point to select a country.");
        return;
      }

      box.classed("empty", false);

      const inScene1 = scene1Data.find(d => d.Country === selectedCountry);
      const inScene2 = scene2Data.find(d => d.Country === selectedCountry);
      const inScene3 = scene3Data.find(d => d.Country === selectedCountry);

      let text = "Selected: " + selectedCountry;
      if (inScene1) {
        text += " | GDP (log): " + d3.format(",.2f")(inScene1.GDP);
        text += " | Life Exp: " + inScene1["Life expectancy"] + " yrs";
      }
      if (inScene2) {
        text += " | Schooling: " + inScene2.Schooling + " yrs";
      }
      if (inScene3) {
        text += " | ICOR: " + inScene3["Income composition of resources"];
      }
      if (!inScene1 && !inScene2 && !inScene3) {
        text += " (no data for this country/year)";
      }

      box.text(text);
    }

    // ---------------------------------------------------
    // SHARED HELPERS
    // ---------------------------------------------------
    function pointRadius(d) {
      if (d.Country === selectedCountry) return 10;
      if (outlierCountries.includes(d.Country)) return 8;
      return 5;
    }

    function pointStroke(d) {
      if (d.Country === selectedCountry) return "#000";
      if (outlierCountries.includes(d.Country)) return "red";
      return "none";
    }

    function pointStrokeWidth(d) {
      return d.Country === selectedCountry ? 3 : 2;
    }

    // ---------------------------------------------------
    // SCENE 1
    // ---------------------------------------------------
    function drawScene1(svg) {

      svg.append("defs").append("clipPath")
        .attr("id", "plot-area")
        .append("rect")
        .attr("width", innerWidth)
        .attr("height", innerHeight);

      const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const x = d3.scaleLinear()
        .domain([GDP_MIN, GDP_MAX])
        .range([0, innerWidth]);

      const y = d3.scaleLinear()
        .domain([
          d3.min(scene1Data, d => d["Life expectancy"]) - 3,
          d3.max(scene1Data, d => d["Life expectancy"]) + 3
        ])
        .range([innerHeight, 0]);

      const color = d3.scaleOrdinal()
        .domain(["Developed", "Developing"])
        .range(["#2b6cb0", "#68a063"]);

      g.append("g")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x)
          .tickValues([8, 10, 12, 14])
          .tickFormat(d3.format(",")));

      g.append("g")
        .call(d3.axisLeft(y)
          .ticks(8)
          .tickFormat(d3.format("d")));

      g.append("text")
        .attr("class", "axis-label")
        .attr("x", innerWidth / 2)
        .attr("y", innerHeight + 40)
        .attr("text-anchor", "middle")
        .text("log(GDP)");

      g.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -innerHeight / 2)
        .attr("y", -45)
        .attr("text-anchor", "middle")
        .text("Life Expectancy (years)");

      const tooltip = d3.select("#tooltip");

      const pointsGroup = g.append("g")
        .attr("clip-path", "url(#plot-area)");

      pointsGroup.selectAll("circle")
        .data(scene1Data)
        .enter()
        .append("circle")
        .attr("cx", d => x(d.GDP))
        .attr("cy", d => y(d["Life expectancy"]))
        .attr("r", d => pointRadius(d))
        .attr("fill", d => color(d.Status))
        .attr("stroke", d => pointStroke(d))
        .attr("stroke-width", d => pointStrokeWidth(d))
        .attr("opacity", 0.8)
        .on("mouseover", function(event, d) {
          tooltip.style("opacity", 1)
            .html(
              "<strong>" + d.Country + "</strong><br>" +
              "GDP: " + d3.format(",.2f")(d.GDP) + "<br>" +
              "Life Expectancy: " + d["Life expectancy"] + " years<br>" +
              "<em>Click to select</em>"
            );
        })
        .on("mousemove", function(event) {
          tooltip.style("left", (event.pageX + 12) + "px")
                 .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", function() {
          tooltip.style("opacity", 0);
        })
        .on("click", function(event, d) {
          selectedCountry = d.Country;
          render();
        });

      const legend = g.append("g")
        .attr("class", "legend")
        .attr("transform", `translate(${innerWidth - 90}, 10)`);

      ["Developed", "Developing"].forEach((status, i) => {
        legend.append("circle")
          .attr("cx", 0)
          .attr("cy", i * 20)
          .attr("r", 6)
          .attr("fill", color(status));
        legend.append("text")
          .attr("x", 12)
          .attr("y", i * 20 + 4)
          .text(status);
      });
    }

    // ---------------------------------------------------
    // SCENE 2: Schooling vs. Life Expectancy
    // ---------------------------------------------------
    function drawScene2(svg) {

      svg.append("defs").append("clipPath")
        .attr("id", "plot-area-2")
        .append("rect")
        .attr("width", innerWidth)
        .attr("height", innerHeight);

      const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const x = d3.scaleLinear()
        .domain([
          d3.min(scene2Data, d => d.Schooling) - 1,
          d3.max(scene2Data, d => d.Schooling) + 1
        ])
        .range([0, innerWidth])
        .nice();

      const y = d3.scaleLinear()
        .domain([
          d3.min(scene2Data, d => d["Life expectancy"]) - 3,
          d3.max(scene2Data, d => d["Life expectancy"]) + 3
        ])
        .range([innerHeight, 0]);

      const color = d3.scaleOrdinal()
        .domain(["Developed", "Developing"])
        .range(["#2b6cb0", "#68a063"]);

      g.append("g")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x).ticks(8));

      g.append("g")
        .call(d3.axisLeft(y)
          .ticks(8)
          .tickFormat(d3.format("d")));

      g.append("text")
        .attr("class", "axis-label")
        .attr("x", innerWidth / 2)
        .attr("y", innerHeight + 40)
        .attr("text-anchor", "middle")
        .text("Schooling (years)");

      g.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -innerHeight / 2)
        .attr("y", -45)
        .attr("text-anchor", "middle")
        .text("Life Expectancy (years)");

      const tooltip = d3.select("#tooltip");

      const pointsGroup = g.append("g")
        .attr("clip-path", "url(#plot-area-2)");

      pointsGroup.selectAll("circle")
        .data(scene2Data)
        .enter()
        .append("circle")
        .attr("cx", d => x(d.Schooling))
        .attr("cy", d => y(d["Life expectancy"]))
        .attr("r", d => pointRadius(d))
        .attr("fill", d => color(d.Status))
        .attr("stroke", d => pointStroke(d))
        .attr("stroke-width", d => pointStrokeWidth(d))
        .attr("opacity", 0.8)
        .on("mouseover", function(event, d) {
          tooltip.style("opacity", 1)
            .html(
              "<strong>" + d.Country + "</strong><br>" +
              "Schooling: " + d.Schooling + " years<br>" +
              "Life Expectancy: " + d["Life expectancy"] + " years<br>" +
              "<em>Click to select</em>"
            );
        })
        .on("mousemove", function(event) {
          tooltip.style("left", (event.pageX + 12) + "px")
                 .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", function() {
          tooltip.style("opacity", 0);
        })
        .on("click", function(event, d) {
          selectedCountry = d.Country;
          render();
        });

      const legend = g.append("g")
        .attr("class", "legend")
        .attr("transform", `translate(${innerWidth - 90}, 10)`);

      ["Developed", "Developing"].forEach((status, i) => {
        legend.append("circle")
          .attr("cx", 0)
          .attr("cy", i * 20)
          .attr("r", 6)
          .attr("fill", color(status));
        legend.append("text")
          .attr("x", 12)
          .attr("y", i * 20 + 4)
          .text(status);
      });
    }

    // ---------------------------------------------------
    // SCENE 3: Income composition of resources vs. Life Expectancy
    // ---------------------------------------------------
    function drawScene3(svg) {

      svg.append("defs").append("clipPath")
        .attr("id", "plot-area-3")
        .append("rect")
        .attr("width", innerWidth)
        .attr("height", innerHeight);

      const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // X scale: Income composition of resources, dynamic based on actual data range
      const x = d3.scaleLinear()
        .domain([
          d3.min(scene3Data, d => d["Income composition of resources"]) - 0.2,
          d3.max(scene3Data, d => d["Income composition of resources"]) + 0.2
        ])
        .range([0, innerWidth])
        .nice();

      // Y scale: same life expectancy approach as Scenes 1 and 2,
      // computed from this scene's own data
      const y = d3.scaleLinear()
        .domain([
          d3.min(scene3Data, d => d["Life expectancy"]) - 3,
          d3.max(scene3Data, d => d["Life expectancy"]) + 3
        ])
        .range([innerHeight, 0]);

      const color = d3.scaleOrdinal()
        .domain(["Developed", "Developing"])
        .range(["#2b6cb0", "#68a063"]);

      g.append("g")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x)
          .tickValues([0, 0.5, 1])
          .tickFormat(d3.format(",")));;

      g.append("g")
        .call(d3.axisLeft(y)
          .ticks(8)
          .tickFormat(d3.format("d")));

      g.append("text")
        .attr("class", "axis-label")
        .attr("x", innerWidth / 2)
        .attr("y", innerHeight + 40)
        .attr("text-anchor", "middle")
        .text("Income Composition of Resources");

      g.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -innerHeight / 2)
        .attr("y", -45)
        .attr("text-anchor", "middle")
        .text("Life Expectancy (years)");

      const tooltip = d3.select("#tooltip");

      const pointsGroup = g.append("g")
        .attr("clip-path", "url(#plot-area-3)");

      pointsGroup.selectAll("circle")
        .data(scene3Data)
        .enter()
        .append("circle")
        .attr("cx", d => x(d["Income composition of resources"]))
        .attr("cy", d => y(d["Life expectancy"]))
        .attr("r", d => pointRadius(d))
        .attr("fill", d => color(d.Status))
        .attr("stroke", d => pointStroke(d))
        .attr("stroke-width", d => pointStrokeWidth(d))
        .attr("opacity", 0.8)
        .on("mouseover", function(event, d) {
          tooltip.style("opacity", 1)
            .html(
              "<strong>" + d.Country + "</strong><br>" +
              "Health Expenditure: " + d["Income composition of resources"] + "%<br>" +
              "Life Expectancy: " + d["Life expectancy"] + " years<br>" +
              "<em>Click to select</em>"
            );
        })
        .on("mousemove", function(event) {
          tooltip.style("left", (event.pageX + 12) + "px")
                 .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", function() {
          tooltip.style("opacity", 0);
        })
        .on("click", function(event, d) {
          selectedCountry = d.Country;
          render();
        });

      const legend = g.append("g")
        .attr("class", "legend")
        .attr("transform", `translate(${innerWidth - 90}, 10)`);

      ["Developed", "Developing"].forEach((status, i) => {
        legend.append("circle")
          .attr("cx", 0)
          .attr("cy", i * 20)
          .attr("r", 6)
          .attr("fill", color(status));
        legend.append("text")
          .attr("x", 12)
          .attr("y", i * 20 + 4)
          .text(status);
      });
    }

  </script>

</body>
</html>
