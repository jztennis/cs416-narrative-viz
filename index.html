<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Narrative Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    #scene-title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #chart {
      border: 1px solid #ccc;
      background: #fafafa;
    }

    .annotation-box {
      max-width: 600px;
      margin-top: 15px;
      padding: 12px 16px;
      background: #fff8dc;
      border-left: 4px solid #d4a017;
      font-size: 15px;
      line-height: 1.4;
    }

    #nav {
      margin-top: 20px;
    }

    button {
      font-size: 16px;
      padding: 8px 16px;
      margin: 0 8px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    #scene-indicator {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    .tooltip {
      position: absolute;
      padding: 8px 12px;
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
    }

    .legend {
      font-size: 13px;
    }

    .axis-label {
      font-size: 13px;
      fill: #333;
    }
  </style>
</head>
<body>

  <div id="scene-title"></div>
  <svg id="chart" width="700" height="450"></svg>
  <div id="annotation" class="annotation-box"></div>

  <div id="nav">
    <button id="prevBtn">&larr; Previous</button>
    <button id="nextBtn">Next &rarr;</button>
  </div>
  <div id="scene-indicator"></div>

  <div class="tooltip" id="tooltip"></div>

  <script>

    // ---------------------------------------------------
    // PARAMETERS
    // ---------------------------------------------------
    let currentScene = 0;
    let fullData = [];
    let scene1Data = [];

    const width = 700;
    const height = 450;
    const margin = { top: 30, right: 30, bottom: 55, left: 60 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const YEAR = 2014;

    // Fixed GDP per-capita display range: $5,000 - $20,000.
    // Countries outside this range will simply not appear (clipped).
    // Change these two numbers if you want a different window.
    const GDP_MIN = 7.5;
    const GDP_MAX = 15;

    const outlierCountries = ["India", "China", "United States of America"];

    const scenes = [
      {
        title: "Scene 1: The Naive Story — GDP vs. Life Expectancy",
        annotation: "As GDP rises, life expectancy tends to rise too — but look closer. " +
                    "Some high-GDP countries (highlighted in red) don't have the life " +
                    "expectancy you'd expect from their wealth alone.",
        draw: drawScene1
      },
      {
        title: "Scene 2: Schooling vs. Life Expectancy",
        annotation: "Placeholder — coming next.",
        draw: drawScene2
      },
      {
        title: "Scene 3: Explore It Yourself",
        annotation: "Placeholder — coming next.",
        draw: drawScene3
      }
    ];

    // ---------------------------------------------------
    // TRIGGERS
    // ---------------------------------------------------
    d3.select("#nextBtn").on("click", function() {
      if (currentScene < scenes.length - 1) {
        currentScene++;
        render();
      }
    });

    d3.select("#prevBtn").on("click", function() {
      if (currentScene > 0) {
        currentScene--;
        render();
      }
    });

    // ---------------------------------------------------
    // LOAD DATA
    // ---------------------------------------------------
    d3.csv("life_expectancy_gdp_data.csv").then(function(data) {

      data.forEach(d => {
        d.Year = +d.Year;
        d.GDP = d.GDP === "" ? null : +d.GDP;
        d["Life expectancy"] = d["Life expectancy"] === "" ? null : +d["Life expectancy"];
      });

      fullData = data;

      scene1Data = fullData.filter(d =>
        d.Year === YEAR &&
        d.GDP !== null &&
        d["Life expectancy"] !== null
      );

      console.log("Scene 1 data points (before GDP window):", scene1Data.length);
      console.log("Points within 5-20 GDP window:",
        scene1Data.filter(d => d.GDP >= GDP_MIN && d.GDP <= GDP_MAX).length);

      render();
    }).catch(function(error) {
      console.error("Error loading CSV:", error);
      d3.select("#scene-title").text("Error loading data — check console.");
    });

    // ---------------------------------------------------
    // RENDER
    // ---------------------------------------------------
    function render() {
      d3.select("#scene-title").text(scenes[currentScene].title);
      d3.select("#annotation").text(scenes[currentScene].annotation);
      d3.select("#scene-indicator")
        .text("Scene " + (currentScene + 1) + " of " + scenes.length);

      d3.select("#prevBtn").property("disabled", currentScene === 0);
      d3.select("#nextBtn").property("disabled", currentScene === scenes.length - 1);

      const svg = d3.select("#chart");
      svg.selectAll("*").remove();

      scenes[currentScene].draw(svg);
    }

    // ---------------------------------------------------
    // SCENE 1
    // ---------------------------------------------------
    function drawScene1(svg) {

      // Clip path so points outside the $5k-$20k window don't
      // spill past the chart border
      svg.append("defs").append("clipPath")
        .attr("id", "plot-area")
        .append("rect")
        .attr("width", innerWidth)
        .attr("height", innerHeight);

      const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // X scale: fixed linear range $5,000 - $20,000
      const x = d3.scaleLinear()
        .domain([GDP_MIN, GDP_MAX])
        .range([0, innerWidth]);

      // Y scale: life expectancy, based on actual data range
      const y = d3.scaleLinear()
        .domain([
          d3.min(scene1Data, d => d["Life expectancy"]) - 3,
          d3.max(scene1Data, d => d["Life expectancy"]) + 3
        ])
        .range([innerHeight, 0]);

      const color = d3.scaleOrdinal()
        .domain(["Developed", "Developing"])
        .range(["#2b6cb0", "#68a063"]);

      // X axis — numeric ticks at 5000, 7500, 10000... etc.
      g.append("g")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x)
          .tickValues([7.5, 10, 12.5, 15])
          .tickFormat(d3.format(",")));

      // Y axis — explicit numeric life expectancy ticks
      g.append("g")
        .call(d3.axisLeft(y)
          .ticks(8)
          .tickFormat(d3.format("d")));

      g.append("text")
        .attr("class", "axis-label")
        .attr("x", innerWidth / 2)
        .attr("y", innerHeight + 40)
        .attr("text-anchor", "middle")
        .text("log(GDP)");

      g.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -innerHeight / 2)
        .attr("y", -45)
        .attr("text-anchor", "middle")
        .text("Life Expectancy (years)");

      const tooltip = d3.select("#tooltip");

      // Points container, clipped to the plot area
      const pointsGroup = g.append("g")
        .attr("clip-path", "url(#plot-area)");

      pointsGroup.selectAll("circle")
        .data(scene1Data)
        .enter()
        .append("circle")
        .attr("cx", d => x(d.GDP))
        .attr("cy", d => y(d["Life expectancy"]))
        .attr("r", d => outlierCountries.includes(d.Country) ? 8 : 5)
        .attr("fill", d => color(d.Status))
        .attr("stroke", d => outlierCountries.includes(d.Country) ? "red" : "none")
        .attr("stroke-width", 2)
        .attr("opacity", 0.8)
        .on("mouseover", function(event, d) {
          tooltip.style("opacity", 1)
            .html(
              "<strong>" + d.Country + "</strong><br>" +
              "GDP: " + d3.format(",.0f")(d.GDP) + "<br>" +
              "Life Expectancy: " + d["Life expectancy"] + " years"
            );
        })
        .on("mousemove", function(event) {
          tooltip.style("left", (event.pageX + 12) + "px")
                 .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", function() {
          tooltip.style("opacity", 0);
        });

      // Legend
      const legend = g.append("g")
        .attr("class", "legend")
        .attr("transform", `translate(${innerWidth - 130}, 10)`);

      ["Developed", "Developing"].forEach((status, i) => {
        legend.append("circle")
          .attr("cx", 0)
          .attr("cy", i * 20)
          .attr("r", 6)
          .attr("fill", color(status));
        legend.append("text")
          .attr("x", 12)
          .attr("y", i * 20 + 4)
          .text(status);
      });
    }

    // ---------------------------------------------------
    // PLACEHOLDER SCENES
    // ---------------------------------------------------
    function drawScene2(svg) {
      svg.append("text")
        .attr("x", 350).attr("y", 225)
        .attr("text-anchor", "middle")
        .text("Scene 2 coming next");
    }

    function drawScene3(svg) {
      svg.append("text")
        .attr("x", 350).attr("y", 225)
        .attr("text-anchor", "middle")
        .text("Scene 3 coming next");
    }

  </script>

</body>
</html>
